<!DOCTYPE html>
<html>
<body>
  <h1>SSE Client</h1>
  <ul id="messages"></ul>
  <script>
    const evtSource = new EventSource('http://localhost:3000/events');
    evtSource.onmessage = function(event) {
      const li = document.createElement('li');
      li.textContent = event.data;
      document.getElementById('messages').appendChild(li);
    };
  </script>
</body>
</html>
